<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>猫咪疼痛表情小测</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <div class="title-row">
        <h1 data-i18n="page.heading">猫咪疼痛表情小测</h1>
        <button id="lang" class="lang" type="button" lang="en">English</button>
      </div>
      <p class="sub" data-i18n="page.intro"></p>
    </header>

    <details class="info">
      <summary data-i18n="fgs.title"></summary>
      <p data-i18n="fgs.p1"></p>
      <p data-i18n="fgs.p2"></p>
      <ul id="fgs-items"></ul>
      <p data-i18n="fgs.p3"></p>
      <p data-i18n="fgs.p4"></p>
    </details>

    <details class="info">
      <summary data-i18n="tips.title"></summary>
      <p data-i18n="tips.body"></p>
    </details>

    <section id="pick" class="card">
      <label class="picker" for="file">
        <input id="file" type="file" accept="image/*">
        <span id="preview-wrap" class="preview-wrap">
          <img id="preview" data-i18n-alt="pick.previewAlt" hidden>
        </span>
        <span id="pick-text" data-i18n="pick.choose"></span>
      </label>
      <button id="analyze" class="btn" data-i18n="btn.analyze" disabled></button>
      <p id="status" role="status" aria-live="polite"></p>
    </section>

    <section id="report" hidden>
      <img id="report-img" data-i18n-alt="report.alt">
      <div class="actions">
        <a id="download" class="btn" data-i18n="btn.save"></a>
        <button id="again" class="btn secondary" data-i18n="btn.again"></button>
      </div>
      <p class="hint" data-i18n="report.hint"></p>
    </section>

    <footer>
      <p data-i18n="footer"></p>
      <a class="source-link" href="https://github.com/cloudycliff/fgs-checker" target="_blank" rel="noopener">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
        <span data-i18n="footer.source"></span>
      </a>
    </footer>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
